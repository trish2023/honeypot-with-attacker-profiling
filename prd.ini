PROJECT NAME: Adaptive SSH/FTP Honeypot with Attacker Behavioral Profiling
OVERVIEW:
A dual-protocol honeypot server built on raw TCP sockets that captures, enriches, and visualizes attacker behavior in real time. Includes tarpitting, GeoIP mapping, credential categorization, behavioral classification, attacker tool fingerprinting, and a fake shell environment for post-auth session capture.
TECH STACK:

Python 3.10+
socket, threading, time, sqlite3 (all stdlib)
geoip2 (GeoIP lookup)
streamlit (dashboard)
plotly (charts and world map)
requests (threat feed integration)
GeoLite2-City.mmdb (MaxMind, free)


FOLDER STRUCTURE:
honeypot/
├── main.py              # entry point, starts both servers
├── ssh_server.py        # fake SSH handler
├── ftp_server.py        # fake FTP handler
├── shell_emulator.py    # fake shell for accepted sessions
├── enrichment.py        # GeoIP, credential tagging, fingerprinting
├── tarpit.py            # delay logic
├── db.py                # SQLite setup and queries
├── alerting.py          # anomaly detection and alerting
├── dashboard.py         # Streamlit dashboard
├── data/
│   ├── default_creds.json
│   ├── common_passwords.txt
│   └── GeoLite2-City.mmdb
└── honeypot.db          # auto created